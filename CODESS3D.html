<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shoot 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
            user-select: none;
            color: white;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* N64 Retro HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
            text-shadow: 2px 2px 0px #000, 4px 4px 0px rgba(0,0,0,0.5);
        }

        .hud-top {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            font-size: 16px;
            color: #ffcc00;
        }

        .hud-bottom {
            position: absolute;
            bottom: 20px;
            left: 30px;
            font-size: 16px;
            color: #00ff00;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 0, 0.4);
            border-radius: 50%;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: rgba(0, 255, 0, 0.8);
            border-radius: 50%;
        }

        /* Overlays (Menus, Transitions, Credits) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 15, 0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            color: #00ffff;
            text-shadow: 4px 4px 0px #ff00ff, 8px 8px 0px #000;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        button {
            background-color: transparent;
            color: #ffcc00;
            border: 4px solid #ffcc00;
            padding: 15px 30px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.2s;
            box-shadow: 4px 4px 0px #000;
        }

        button:hover {
            background-color: #ffcc00;
            color: #000;
        }

        .message { font-size: 20px; color: #fff; margin-bottom: 10px; line-height: 1.5; }
        .sub-message { font-size: 12px; color: #aaa; margin-top: 20px; }

        #level-transition { display: none; background: transparent; pointer-events: none; }
        #level-text { font-size: 32px; color: #ff00ff; text-shadow: 4px 4px 0px #000; }

        #credits-screen { display: none; background: #000; }
        .credits-container { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .credits-scroll {
            position: absolute;
            bottom: -100%;
            width: 100%;
            text-align: center;
            animation: scrollUp 15s linear forwards;
        }
        .credits-scroll h2 { color: #00ffff; margin-bottom: 30px; }
        .credits-scroll p { margin-bottom: 15px; font-size: 12px; color: #ccc; line-height: 2; }

        @keyframes scrollUp {
            0% { bottom: -100%; }
            100% { bottom: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- UI Elements -->
    <div id="hud">
        <div class="hud-top">
            <div id="score-display">SCORE: 0</div>
            <div id="level-display">LEVEL: 1</div>
        </div>
        <div class="hud-bottom" id="health-display">HEALTH: 100%</div>
        <div id="crosshair"></div>
    </div>

    <!-- Menus -->
    <div id="start-menu" class="overlay">
        <div class="logo">SPACE SHOOT<br>3D</div>
        <div class="message">PREPARE FOR BATTLE</div>
        <button id="start-btn">START GAME</button>
        <div class="sub-message">WASD / Arrows to Move | SPACE to Shoot</div>
    </div>

    <div id="game-over-menu" class="overlay" style="display: none;">
        <div class="logo" style="color: #ff0000; text-shadow: 4px 4px 0px #550000, 8px 8px 0px #000;">SHIP DESTROYED</div>
        <div class="message" id="final-score">SCORE: 0</div>
        <button id="restart-btn">RETRY</button>
    </div>

    <div id="level-transition" class="overlay">
        <div id="level-text">LEVEL 1</div>
    </div>

    <div id="credits-screen" class="overlay">
        <div class="credits-container">
            <div class="credits-scroll">
                <h2>MISSION ACCOMPLISHED</h2>
                <p>EARTH IS SAVED</p>
                <p><br><br></p>
                <p>DIRECTOR</p>
                <p>You</p>
                <p><br></p>
                <p>PROGRAMMING</p>
                <p>Gemini AI</p>
                <p><br></p>
                <p>THANKS FOR PLAYING</p>
                <p>SPACE SHOOT 3D</p>
            </div>
        </div>
        <button id="credits-restart-btn" style="position: absolute; bottom: 20px; z-index: 100;">MAIN MENU</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /**
         * ==========================================
         * CUSTOM SPRITE CONFIGURATION
         * ==========================================
         * Replace the empty strings with your own image URLs (e.g., 'assets/player.png').
         * If left empty, the game will automatically generate retro pixel-art placeholders.
         */
        const CUSTOM_SPRITES = {
            player: 'player.png',          
            enemyBlueGreen: '',  // Level 1, 5
            enemyRed: '',        // Level 2, 6
            asteroid: '',        // Level 2, 5, 6, 7, 8
            enemyGrey: '',       // Level 3, 7
            spiderRed: '',       // Level 3, 7
            ufo: '',             // Level 4, 8, 9
            mothership: '',      // Level 9
            earth: ''            // Level 9 Background
        };

        // --- Game Constants & Variables ---
        const BOUNDS = { x: 35, y: 20 };
        const SHIP_SPEED = 45;
        const FIRE_RATE = 0.15;
        
        let state = 'MENU'; // MENU, PLAYING, TRANSITION, CINEMATIC, CREDITS
        let score = 0;
        let health = 100;
        let level = 1;
        let killsInLevel = 0;
        const KILLS_TO_ADVANCE = 15; // Kills needed to beat normal levels

        let scene, camera, renderer, clock, textureLoader;
        let playerShip;
        let backgroundStars, asteroidFieldGrp, earthSprite;
        
        const lasers = [];
        const enemies = [];
        const particles = [];
        
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let lastFired = 0;
        let levelTimer = 0;

        // Texture Dictionary
        const textures = {};

        // DOM Elements
        const ui = {
            start: document.getElementById('start-menu'),
            over: document.getElementById('game-over-menu'),
            hud: document.getElementById('hud'),
            score: document.getElementById('score-display'),
            health: document.getElementById('health-display'),
            lvl: document.getElementById('level-display'),
            transition: document.getElementById('level-transition'),
            lvlText: document.getElementById('level-text'),
            credits: document.getElementById('credits-screen'),
            finalScore: document.getElementById('final-score')
        };

        // Fallback pixel art generators if no URL provided
        function generatePixelTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);

            if (type === 'player') {
                ctx.fillStyle = '#ccc';
                ctx.beginPath(); ctx.moveTo(32, 0); ctx.lineTo(64, 64); ctx.lineTo(32, 48); ctx.lineTo(0, 64); ctx.fill();
                ctx.fillStyle = '#0ff'; ctx.fillRect(28, 48, 8, 16); // engine
            } else if (type === 'enemyBlueGreen') {
                ctx.fillStyle = '#0f0'; ctx.fillRect(16, 16, 32, 32);
                ctx.fillStyle = '#00f'; ctx.beginPath(); ctx.moveTo(32, 64); ctx.lineTo(64, 16); ctx.lineTo(0, 16); ctx.fill();
            } else if (type === 'enemyRed') {
                ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.moveTo(32, 64); ctx.lineTo(64, 0); ctx.lineTo(32, 16); ctx.lineTo(0, 0); ctx.fill();
            } else if (type === 'asteroid') {
                ctx.fillStyle = '#666'; ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(20, 20, 8, 0, Math.PI*2); ctx.arc(40, 45, 10, 0, Math.PI*2); ctx.fill();
            } else if (type === 'enemyGrey') {
                ctx.fillStyle = '#888'; ctx.fillRect(0, 24, 64, 16); ctx.fillRect(24, 0, 16, 64);
            } else if (type === 'spiderRed') {
                ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(32, 32, 16, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(0, 30, 64, 4); ctx.fillRect(30, 0, 4, 64); // legs
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(64,64); ctx.stroke();
            } else if (type === 'ufo') {
                ctx.fillStyle = '#aaa'; ctx.beginPath(); ctx.ellipse(32, 40, 30, 12, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#0ff'; ctx.beginPath(); ctx.arc(32, 28, 16, Math.PI, 0); ctx.fill();
            } else if (type === 'mothership') {
                ctx.fillStyle = '#333'; ctx.fillRect(0, 20, 64, 24);
                ctx.fillStyle = '#f0f'; ctx.fillRect(10, 30, 8, 8); ctx.fillRect(46, 30, 8, 8);
                ctx.fillStyle = '#555'; ctx.beginPath(); ctx.moveTo(32, 64); ctx.lineTo(64, 20); ctx.lineTo(0, 20); ctx.fill();
            } else if (type === 'earth') {
                canvas.width = 256; canvas.height = 256;
                ctx.fillStyle = '#000044'; ctx.beginPath(); ctx.arc(128, 128, 126, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#008800'; ctx.beginPath(); ctx.arc(80, 80, 40, 0, Math.PI*2); ctx.arc(160, 140, 50, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(128, 20, 30, 0, Math.PI*2); ctx.fill(); // pole
            }

            return canvas.toDataURL();
        }

        function loadTextures() {
            textureLoader = new THREE.TextureLoader();
            for (const [key, url] of Object.entries(CUSTOM_SPRITES)) {
                const finalUrl = url !== '' ? url : generatePixelTexture(key);
                textures[key] = textureLoader.load(finalUrl);
                textures[key].magFilter = THREE.NearestFilter; // Retro pixel look
                textures[key].colorSpace = THREE.SRGBColorSpace;
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 100, 600);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 40);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1);

            loadTextures();
            createEnvironment();
            createPlayer();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            
            document.getElementById('start-btn').addEventListener('click', () => startLevel(1));
            document.getElementById('restart-btn').addEventListener('click', () => startLevel(1));
            document.getElementById('credits-restart-btn').addEventListener('click', resetToMenu);

            clock = new THREE.Clock();
            animate();
        }

        function createEnvironment() {
            // Pixel Stars for forward momentum
            const starGeo = new THREE.BufferGeometry();
            const starCount = 2500;
            const starPos = new Float32Array(starCount * 3);
            for(let i=0; i < starCount * 3; i+=3) {
                starPos[i] = (Math.random() - 0.5) * 800;
                starPos[i+1] = (Math.random() - 0.5) * 800;
                starPos[i+2] = (Math.random() - 0.5) * 1000 - 100;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 });
            backgroundStars = new THREE.Points(starGeo, starMat);
            scene.add(backgroundStars);

            // Asteroid Field Group (used in L5-8)
            asteroidFieldGrp = new THREE.Group();
            scene.add(asteroidFieldGrp);
            asteroidFieldGrp.visible = false;

            // Earth Sprite (used in L9)
            const earthMat = new THREE.SpriteMaterial({ map: textures.earth, color: 0xffffff });
            earthSprite = new THREE.Sprite(earthMat);
            earthSprite.scale.set(300, 300, 1);
            earthSprite.position.set(0, -50, -800);
            scene.add(earthSprite);
            earthSprite.visible = false;
        }

        function createPlayer() {
            // Use a plane geometry mapping the texture to maintain aspect and allow rotation banking
            const mat = new THREE.MeshBasicMaterial({ 
                map: textures.player, 
                transparent: true, 
                side: THREE.DoubleSide 
            });
            playerShip = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), mat);
            playerShip.position.set(0, -10, 20); // start slightly offscreen for entrance
            scene.add(playerShip);
        }

        function spawnLaser(isEnemy, originNode, offset) {
            const mat = new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff0000 : 0x00ff00 });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 3), mat);
            mesh.position.copy(originNode.position);
            mesh.position.x += offset.x;
            mesh.position.y += offset.y;
            mesh.position.z += offset.z;
            
            scene.add(mesh);
            lasers.push({ 
                mesh, 
                speed: isEnemy ? -80 : 150, 
                isEnemy 
            });
        }

        function spawnEnemy(type, scale, hp, behavior) {
            const mat = new THREE.SpriteMaterial({ map: textures[type], color: 0xffffff });
            const mesh = new THREE.Sprite(mat);
            mesh.scale.set(scale, scale, 1);
            
            // Random start pos outside front bounds
            mesh.position.set(
                (Math.random() - 0.5) * BOUNDS.x * 2,
                (Math.random() - 0.5) * BOUNDS.y * 2,
                -300 - Math.random() * 100
            );
            
            scene.add(mesh);
            enemies.push({ 
                mesh, 
                hp, 
                maxHp: hp,
                type,
                behavior, // 'straight', 'weave', 'chase', 'boss'
                time: Math.random() * 100 
            });
        }

        function createExplosion(pos, colorHex) {
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const pGeo = new THREE.PlaneGeometry(1, 1);
            for(let i=0; i<8; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                scene.add(p);
                particles.push({
                    mesh: p,
                    vel: new THREE.Vector3((Math.random()-0.5)*30, (Math.random()-0.5)*30, (Math.random()-0.5)*30),
                    life: 1.0
                });
            }
        }

        function startLevel(lvlNum) {
            level = lvlNum;
            killsInLevel = 0;
            state = 'TRANSITION';
            ui.start.style.display = 'none';
            ui.over.style.display = 'none';
            ui.credits.style.display = 'none';
            ui.hud.style.display = 'none';
            
            // Clear current entities
            lasers.forEach(l => scene.remove(l.mesh));
            enemies.forEach(e => scene.remove(e.mesh));
            particles.forEach(p => scene.remove(p.mesh));
            lasers.length = 0; enemies.length = 0; particles.length = 0;

            // Reset Player
            playerShip.position.set(0, -30, 15);
            if(level === 1) { score = 0; health = 100; }
            
            // UI setup
            ui.lvl.innerText = `LEVEL: ${level}`;
            updateHUD();

            // Setup Level Environment
            earthSprite.visible = (level === 9);
            asteroidFieldGrp.visible = (level >= 5 && level <= 8);
            if(asteroidFieldGrp.visible) populateAsteroidField();

            // Show Transition
            ui.transition.style.display = 'flex';
            ui.lvlText.innerText = level === 9 ? "FINAL MISSION" : `LEVEL ${level}`;
            
            setTimeout(() => {
                ui.transition.style.display = 'none';
                ui.hud.style.display = 'block';
                state = 'PLAYING';
            }, 2500);
        }

        function populateAsteroidField() {
            // Add some passive visual asteroids zooming by
            while(asteroidFieldGrp.children.length > 0){ 
                asteroidFieldGrp.remove(asteroidFieldGrp.children[0]); 
            }
            const mat = new THREE.SpriteMaterial({ map: textures.asteroid, color: 0x888888 });
            for(let i=0; i<40; i++) {
                const rock = new THREE.Sprite(mat);
                rock.scale.setScalar(Math.random()*15 + 5);
                rock.position.set((Math.random()-0.5)*200, (Math.random()-0.5)*100, -500 + Math.random()*400);
                asteroidFieldGrp.add(rock);
            }
        }

        function levelDirector(dt) {
            levelTimer += dt;
            
            // Standard Enemy Spawning rules
            if (enemies.length < 5 + level && Math.random() < 0.03 && state === 'PLAYING') {
                if (level === 1 || level === 5) {
                    spawnEnemy('enemyBlueGreen', 6, 1, 'straight');
                } 
                else if (level === 2 || level === 6) {
                    if(Math.random() < 0.5) spawnEnemy('enemyRed', 6, 1, 'weave');
                    else spawnEnemy('asteroid', 10, 3, 'straight'); // Tougher obstacle
                } 
                else if (level === 3 || level === 7) {
                    if(Math.random() < 0.5) spawnEnemy('enemyGrey', 7, 2, 'straight');
                    else spawnEnemy('spiderRed', 5, 1, 'chase');
                }
                else if (level === 4 || level === 8) {
                    if(enemies.length === 0 && killsInLevel === 0) {
                        spawnEnemy('ufo', 20, 20, 'boss'); // Boss level
                    }
                }
                else if (level === 9) {
                    if(enemies.length === 0 && killsInLevel === 0) {
                        spawnEnemy('mothership', 40, 50, 'boss');
                        spawnEnemy('ufo', 15, 10, 'boss_minion');
                        spawnEnemy('ufo', 15, 10, 'boss_minion');
                        spawnEnemy('ufo', 15, 10, 'boss_minion');
                    }
                }
            }

            // Progression check
            if (level !== 4 && level !== 8 && level !== 9) {
                if (killsInLevel >= KILLS_TO_ADVANCE) {
                    startLevel(level + 1);
                }
            } else if (level === 4 || level === 8) {
                // If boss is dead (killsInLevel tracks boss death here)
                if(enemies.length === 0 && killsInLevel > 0) startLevel(level + 1);
            } else if (level === 9) {
                if(enemies.length === 0 && killsInLevel > 0) triggerEnding();
            }
        }

        function triggerEnding() {
            state = 'CINEMATIC';
            ui.hud.style.display = 'none';
        }

        function update(dt) {
            if (state === 'MENU' || state === 'CREDITS') return;

            // Starfield motion
            const positions = backgroundStars.geometry.attributes.position.array;
            for(let i=2; i<positions.length; i+=3) {
                positions[i] += 200 * dt;
                if(positions[i] > 100) positions[i] = -800;
            }
            backgroundStars.geometry.attributes.position.needsUpdate = true;

            // Asteroid Field motion
            if(asteroidFieldGrp.visible) {
                asteroidFieldGrp.children.forEach(rock => {
                    rock.position.z += 150 * dt;
                    if(rock.position.z > 50) {
                        rock.position.z = -600;
                        rock.position.x = (Math.random()-0.5)*200;
                    }
                });
            }

            if (state === 'TRANSITION') {
                // Fly in animation
                playerShip.position.y += (0 - playerShip.position.y) * 2 * dt;
                return;
            }

            if (state === 'CINEMATIC') {
                // Fly towards Earth
                playerShip.position.z -= 40 * dt;
                playerShip.scale.multiplyScalar(0.99); // shrink
                if(playerShip.position.z < -200) {
                    state = 'CREDITS';
                    ui.credits.style.display = 'flex';
                }
                return;
            }

            levelDirector(dt);

            // --- Player Movement & Input ---
            let targetRotZ = 0, targetRotX = 0;
            if (keys.a && playerShip.position.x > -BOUNDS.x) { playerShip.position.x -= SHIP_SPEED * dt; targetRotZ = 0.3; }
            if (keys.d && playerShip.position.x < BOUNDS.x) { playerShip.position.x += SHIP_SPEED * dt; targetRotZ = -0.3; }
            if (keys.w && playerShip.position.y < BOUNDS.y) { playerShip.position.y += SHIP_SPEED * dt; targetRotX = -0.3; }
            if (keys.s && playerShip.position.y > -BOUNDS.y) { playerShip.position.y -= SHIP_SPEED * dt; targetRotX = 0.3; }
            
            // Banking interpolation
            playerShip.rotation.z += (targetRotZ - playerShip.rotation.z) * 10 * dt;
            playerShip.rotation.x += (targetRotX - playerShip.rotation.x) * 10 * dt;

            if (keys.space && clock.getElapsedTime() - lastFired > FIRE_RATE) {
                spawnLaser(false, playerShip, {x: -2, y: 0, z: -2});
                spawnLaser(false, playerShip, {x: 2, y: 0, z: -2});
                lastFired = clock.getElapsedTime();
            }

            // --- Update Lasers ---
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                l.mesh.position.z -= l.speed * dt;
                
                // Collision with player
                if(l.isEnemy && l.mesh.position.distanceTo(playerShip.position) < 3) {
                    takeDamage(10);
                    scene.remove(l.mesh);
                    lasers.splice(i, 1);
                    continue;
                }

                if (l.mesh.position.z < -600 || l.mesh.position.z > 50) {
                    scene.remove(l.mesh);
                    lasers.splice(i, 1);
                }
            }

            // --- Update Enemies ---
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.time += dt;

                // Behavior movement
                if (e.behavior === 'straight') {
                    e.mesh.position.z += 60 * dt;
                } else if (e.behavior === 'weave') {
                    e.mesh.position.z += 50 * dt;
                    e.mesh.position.x += Math.sin(e.time * 3) * 30 * dt;
                } else if (e.behavior === 'chase') {
                    e.mesh.position.z += 70 * dt;
                    const dirX = playerShip.position.x - e.mesh.position.x;
                    e.mesh.position.x += Math.sign(dirX) * 20 * dt;
                } else if (e.behavior.includes('boss')) {
                    // Boss hovers around Z = -150
                    e.mesh.position.z += (-150 - e.mesh.position.z) * 2 * dt;
                    e.mesh.position.x = Math.sin(e.time) * 20;
                    if(e.behavior === 'boss_minion') {
                        e.mesh.position.x += Math.cos(e.time*2) * 15;
                        e.mesh.position.y = Math.sin(e.time*3) * 10;
                    }
                    
                    // Boss shooting
                    if(Math.random() < 0.02) {
                        spawnLaser(true, e.mesh, {x:0, y:-2, z:5});
                    }
                }

                // Player Collision
                if (e.mesh.position.distanceTo(playerShip.position) < (e.behavior.includes('boss') ? 15 : 4)) {
                    takeDamage(20);
                    createExplosion(e.mesh.position, 0xffaa00);
                    if(!e.behavior.includes('boss')) {
                        scene.remove(e.mesh);
                        enemies.splice(i, 1);
                    }
                    continue;
                }

                // Laser Collision
                let destroyed = false;
                for (let j = lasers.length - 1; j >= 0; j--) {
                    const l = lasers[j];
                    if (!l.isEnemy && l.mesh.position.distanceTo(e.mesh.position) < (e.behavior.includes('boss') ? 10 : 4)) {
                        createExplosion(l.mesh.position, 0xffaa00);
                        scene.remove(l.mesh);
                        lasers.splice(j, 1);
                        
                        e.hp--;
                        // Flash red
                        e.mesh.material.color.setHex(0xff0000);
                        setTimeout(() => { if(e && e.mesh) e.mesh.material.color.setHex(0xffffff); }, 100);

                        if(e.hp <= 0) {
                            createExplosion(e.mesh.position, 0x00ffff);
                            createExplosion(e.mesh.position, 0xff00ff);
                            scene.remove(e.mesh);
                            enemies.splice(i, 1);
                            score += e.maxHp * 100;
                            killsInLevel++;
                            updateHUD();
                            destroyed = true;
                        }
                        break;
                    }
                }

                if (!destroyed && e.mesh.position.z > 50) {
                    scene.remove(e.mesh);
                    enemies.splice(i, 1);
                }
            }

            // --- Update Particles ---
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.vel, dt);
                p.life -= dt * 3;
                p.mesh.scale.setScalar(p.life);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        function takeDamage(amt) {
            health -= amt;
            // Flash screen red effect via HUD text
            ui.health.style.color = '#ff0000';
            setTimeout(() => ui.health.style.color = health <= 30 ? '#ff0000' : '#00ff00', 200);
            updateHUD();
            if(health <= 0) gameOver();
        }

        function updateHUD() {
            ui.score.innerText = `SCORE: ${score}`;
            ui.health.innerText = `HEALTH: ${Math.max(0, health)}%`;
            ui.health.style.color = health <= 30 ? '#ff0000' : '#00ff00';
        }

        function gameOver() {
            state = 'MENU';
            ui.hud.style.display = 'none';
            ui.over.style.display = 'flex';
            ui.finalScore.innerText = `FINAL SCORE: ${score}`;
            createExplosion(playerShip.position, 0xff0000);
            playerShip.position.set(0, -100, 0); // Hide
        }

        function resetToMenu() {
            state = 'MENU';
            ui.credits.style.display = 'none';
            ui.start.style.display = 'flex';
            // Reset player visual
            playerShip.scale.setScalar(1);
        }

        function onKeyDown(e) {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        }

        function onKeyUp(e) {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(clock) {
                let dt = clock.getDelta();
                if(dt > 0.1) dt = 0.1; // Cap delta
                update(dt);
            }
            renderer.render(scene, camera);
        }

        // Boot
        window.onload = init;
    </script>
</body>
</html>
